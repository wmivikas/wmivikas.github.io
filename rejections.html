<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejections · Vikas Kumar</title>
    <meta name="description" content="A public log of rejections — papers, applications and programmes." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="shortcut icon" href="assets/images/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b509ac" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Runs before first paint so dark-mode visitors never see a white flash. -->
    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          const saved = localStorage.getItem("site-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body data-page="rejections">
    <a class="skip-link" href="#profile-content">Skip to content</a>
    <div id="progress-container"><div id="progress"></div></div>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand-name" href="index.html">vikas kumar</a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html#about">about</a>
          <a href="index.html#news">news</a>
          <a href="index.html#publications">publications</a>
          <a href="index.html#contact">contact</a>
        </nav>
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Switch to dark mode"
          title="Switch theme"
        >
          <span id="theme-toggle-icon" aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <main class="container" id="profile-content">
      <noscript>
        JavaScript is required to load this page. Please enable JavaScript.
      </noscript>
    </main>

    <footer class="site-footer">
      <p>
        © <span id="year"></span> <span id="footer-owner">Vikas Kumar</span>.
        <span id="footer-last-updated" class="footer-version" hidden></span>
        <span id="footer-template-version" class="footer-version" hidden></span>
      </p>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
