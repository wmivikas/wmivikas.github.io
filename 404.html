<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Vikas Kumar</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="180x180" href="/assets/images/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/assets/css/style.css?v=20261121e" />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("site-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Primary">
        <a class="brand" href="/">Homepage</a>
        <div class="nav-links">
          <a href="/#about">About</a>
          <a href="/#research">Research</a>
          <a href="/#publications">Publications</a>
          <a href="/#contact">Contact</a>
        </div>
      </nav>
    </header>

    <div class="page" style="grid-template-columns: 1fr">
      <main class="content">
        <section>
          <h1 class="page-title" style="display: block">Page not found</h1>
          <div class="prose">
            <p>The link may be out of date, or the page may have moved.</p>
            <p><a href="/">← Back to the homepage</a></p>
          </div>
        </section>
      </main>
    </div>

    <footer class="site-footer">
      <p>© <span id="year"></span> Vikas Kumar.</p>
    </footer>

    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
