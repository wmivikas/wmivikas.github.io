<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Vikas Kumar</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("site-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand-name" href="/">vikas kumar</a>
        <nav class="nav-links" aria-label="Primary">
          <a href="/#about">about</a>
          <a href="/#news">news</a>
          <a href="/#publications">publications</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="panel is-visible">
        <h1 class="post-title">404</h1>
        <p class="post-description">This page does not exist.</p>
        <p>The link may be out of date, or the page may have moved.</p>
        <p><a href="/">← Back to the homepage</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> Vikas Kumar.</p>
    </footer>

    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
